<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>告警看板 - 鹰眼</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4">
  <!-- 统计卡 -->
  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="yz-stat2 stat-total"><div class="icon">🔔</div><div><div class="num" id="sum-total">-</div><div class="label">今日告警总数</div></div></div></div>
    <div class="col-md-4"><div class="yz-stat2 stat-firing"><div class="icon">🔥</div><div><div class="num" id="sum-firing">-</div><div class="label">当前触发中</div></div></div></div>
    <div class="col-md-4"><div class="yz-stat2 stat-resolved"><div class="icon">✅</div><div><div class="num" id="sum-resolved">-</div><div class="label">今日已恢复</div></div></div></div>
  </div>

  <!-- 筛选区 -->
  <div class="card p-3 mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-auto">
        <select id="f-status" class="form-select">
          <option value="">全部状态</option>
          <option value="firing">触发中</option>
          <option value="resolved">已恢复</option>
        </select>
      </div>
      <div class="col-auto">
        <select id="f-name" class="form-select">
          <option value="">全部告警</option>
          <option>NodeMemoryHigh</option>
          <option>NodeCpuHigh</option>
          <option>NodeDiskAlmostFull</option>
          <option>TargetDown</option>
          <option>HttpProbeFailed</option>
        </select>
      </div>
      <div class="col-auto"><input id="f-from" type="date" class="form-control"></div>
      <div class="col-auto"><input id="f-to" type="date" class="form-control"></div>
      <div class="col-auto"><button class="btn btn-primary" onclick="loadAlerts()">查询</button></div>
      <div class="col-auto"><button class="btn btn-outline-secondary" onclick="resetFilter()">重置</button></div>
    </div>
  </div>

  <!-- 告警表格 -->
  <div class="card p-3">
    <table class="table table-hover align-middle" id="alert-table">
      <thead></thead><tbody></tbody>
    </table>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav([
  { text: '告警看板', href: 'alerts.html' },
  { text: '值班表', href: 'oncall.html' },
  { text: 'Grafana', href: 'http://' + location.hostname + ':3000' },
  { text: 'Prometheus', href: 'http://' + location.hostname + ':9090' }
]);

function resetFilter() {
  ['f-status', 'f-name', 'f-from', 'f-to'].forEach(id => document.getElementById(id).value = '');
  loadAlerts();
}

async function loadAlerts() {
  const qs = new URLSearchParams();
  const status = document.getElementById('f-status').value;
  const name = document.getElementById('f-name').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  if (status) qs.set('status', status);
  if (name) qs.set('alertName', name);
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);

  const res = await api('/api/alert/list?' + qs.toString());
  const d = res.data;
  document.getElementById('sum-total').textContent = d.summary.total;
  document.getElementById('sum-firing').textContent = d.summary.firing;
  document.getElementById('sum-resolved').textContent = d.summary.resolved;

  renderTable('#alert-table', d.list,
    [
      { key: 'alert_name', title: '告警名' },
      { key: 'instance', title: '来源实例' },
      { key: 'summary', title: '说明' },
      { key: 'fired_at', title: '触发时间' },
      { key: 'resolved_at', title: '恢复时间' }
    ],
    item => `<td>${severityBadge(item.severity)} ${statusBadge(item.status)}</td>`);
}

loadAlerts();
// 每 10 秒自动刷新，方便演示时观察告警实时入库
setInterval(loadAlerts, 10000);
</script>
</body>
</html>
