<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>值班表 - 鹰眼</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4" style="max-width: 900px;">
  <!-- 今日值班大卡片 -->
  <div class="yz-duty-card mb-4" id="duty-today">
    <div class="small" style="opacity:.85;">今日值班</div>
    <div class="fs-3 fw-bold mt-1" id="duty-name">加载中…</div>
    <div class="mt-1" id="duty-phone"></div>
  </div>

  <!-- 值班安排表 -->
  <div class="card p-3 mb-4">
    <h5 class="mb-3">📅 值班安排</h5>
    <table class="table table-hover align-middle" id="oncall-table">
      <thead></thead><tbody></tbody>
    </table>
  </div>

  <!-- 新增值班 -->
  <div class="card p-3">
    <h6 class="mb-3">新增值班</h6>
    <div class="row g-2">
      <div class="col-auto"><input id="add-date" type="date" class="form-control"></div>
      <div class="col-auto"><input id="add-name" class="form-control" placeholder="姓名"></div>
      <div class="col-auto"><input id="add-phone" class="form-control" placeholder="电话"></div>
      <div class="col-auto"><button class="btn btn-primary" onclick="addOnCall()">添加</button></div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav([
  { text: '告警看板', href: 'alerts.html' },
  { text: '值班表', href: 'oncall.html' },
  { text: 'Grafana', href: 'http://' + location.hostname + ':3000' }
]);

async function loadOnCall() {
  const res = await api('/api/oncall/list');
  const list = res.data.list;
  const today = new Date().toISOString().slice(0, 10);

  // 顶部大卡片：匹配今天的值班人
  const onDuty = list.find(r => r.duty_date === today);
  document.getElementById('duty-name').textContent = onDuty ? `${onDuty.name}` : '今日无值班安排';
  document.getElementById('duty-phone').textContent = onDuty ? ('📞 ' + (onDuty.phone || '-')) : '请在下方添加值班安排';

  renderTable('#oncall-table', list,
    [
      { key: 'duty_date', title: '日期' },
      { key: 'name', title: '姓名' },
      { key: 'phone', title: '电话' }
    ],
    item => `<td>${item.duty_date === today ? '<span class="badge text-bg-info">今天</span>' : ''}</td>`);
}

async function addOnCall() {
  const dutyDate = document.getElementById('add-date').value;
  const name = document.getElementById('add-name').value.trim();
  const phone = document.getElementById('add-phone').value.trim();
  if (!dutyDate || !name) return showToast('日期和姓名必填', 'info');
  await api('/api/oncall/add', {
    method: 'POST',
    body: JSON.stringify({ dutyDate, name, phone })
  });
  showToast('添加成功', 'success');
  document.getElementById('add-name').value = '';
  document.getElementById('add-phone').value = '';
  loadOnCall();
}

loadOnCall();
</script>
</body>
</html>
