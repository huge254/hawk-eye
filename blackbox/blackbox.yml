# Blackbox Exporter 探测模块
# http_2xx：期望 HTTP 状态码 2xx/3xx 即视为健康

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 204, 301, 302]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
